<style>
/* Layout: a test-report-form strip on top, one working column of cards, bottom tab bar like a phone app */
:root{
  --bg:#EBEFEE; --surface:#F9FBFA; --surface-2:#E1E7E5; --ink:#132029; --muted:#56676D; --line:#CDD6D3;
  --accent:#1E5A6E; --accent-ink:#F9FBFA; --pencil:#E2B22A; --pencil-soft:#F6E7B4;
  --good:#2E7A4D; --warn:#AE5F17; --bad:#B23B3B;
  --cL:#2B66AE; --cR:#2C8A66; --cW:#B0532B; --cS:#7650AB; --cV:#86892B;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E161A; --surface:#152127; --surface-2:#1C2B32; --ink:#E1EBE9; --muted:#8EA1A5; --line:#273841;
  --accent:#71B9CF; --accent-ink:#0E161A; --pencil:#E6C04B; --pencil-soft:#4A3F1C;
  --good:#5DB984; --warn:#E0954F; --bad:#E06A6A;
  --cL:#6FA3E6; --cR:#5CC39B; --cW:#E58A60; --cS:#A98BDB; --cV:#C2C55A; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
a{color:var(--accent)}
.app{max-width:760px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}

.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:22px;font-weight:800;letter-spacing:.01em}
.top .sub{font-size:12px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.sync{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);border:0;background:none;padding:0;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)} .sync.err i{background:var(--bad)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}

.trf{border:1.5px solid var(--ink);border-radius:4px;background:var(--surface);margin-bottom:16px}
.trf-head{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-mono)}
.trf-row{display:grid;grid-template-columns:repeat(4,1fr) 1.25fr}
.band{padding:8px 10px 10px;border-right:1px solid var(--line);min-width:0}
.band:last-child{border-right:0;background:var(--pencil-soft)}
.band .lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .val{font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.band .tgt{font-size:12px;font-family:var(--f-mono)}
.band .tgt.ok{color:var(--good)} .band .tgt.gap{color:var(--warn)}
.trf-foot{padding:6px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.l-short{display:none}
@media (max-width:420px){.band{padding:6px 7px 8px}.band .val{font-size:24px}.band .lab{font-size:10px}.l-long{display:none}.l-short{display:inline}}

.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h2{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .aside{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.card h2 .btn{margin-left:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.split{grid-template-columns:1fr}}
.big{font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;line-height:1.2;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}

.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

.bar span{height:100%}
.heat{max-width:300px;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:6px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%;position:relative}
.heat i.fill::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--accent);opacity:var(--o)}

.heat i.future{background:transparent}

.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}

.pill.pencil{background:var(--pencil-soft);border-color:var(--pencil)}
.list{display:grid}
.item{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0;padding-top:4px}
.item .line1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .title{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips{display:flex;gap:6px 10px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
details .body{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:6px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:transparent;padding:6px 2px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--pencil);color:#1b1b1b;font-size:10px;border-radius:999px;padding:0 5px;font-family:var(--f-mono)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,25,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:14px}}
.panel h3{font-size:18px;margin-bottom:12px}
.panel h4{font-size:14px;margin:14px 0 6px}
.form{display:grid;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0;font-size:16px}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:12px;color:var(--accent);font-family:var(--f-mono)}
.formacts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.formacts .sp{flex:1}
.menu{display:grid;gap:8px}
.menu .btn{text-align:left;padding:12px 14px}
.menu .btn small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px}
.steps li{margin:4px 0}
code{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.timer .clock{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.timer .grow{flex:1}
.nudge{border-color:var(--pencil);background:var(--pencil-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

    <div class="grow">

<script>
"use strict";
/* ================= constants ================= */
const APP_VERSION='1.1.0';
const SECS=[{k:'L',name:'听力',en:'Listening'},{k:'R',name:'阅读',en:'Reading'},{k:'W',name:'写作',en:'Writing'},{k:'S',name:'口语',en:'Speaking'}];
const LOGK=[...SECS,{k:'V',name:'词汇',en:'Vocab'}];
const SECNAME={L:'听力',R:'阅读',W:'写作',S:'口语',V:'词汇',G:'综合'};
const KINDNAME={link:'链接',note:'笔记',book:'书'};
const INTERVALS=[1,3,7,14,30,60];
const L_TABLE=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,0]];
const R_TABLE=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,0]];
const PHASES=window.SEED_PHASES||[];
const DEFAULT_CONFIG={target:{overall:7.5,L:8,R:8,W:6.5,S:7},baseline:{L:6,R:6,W:6,S:6,note:'2026 年 10 月自估，做完第一套模考后由最新成绩替换'},exams:[{label:'一战',date:''},{label:'二战',date:''}]};
const KEY='ielts-sprint-v1', SKEY='ielts-sprint-sync', GIST_FILE='ielts-sprint.json';
const COLS=['logs','mocks','essays','cards','mats','todos','meta'];

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/86400000);
const md=s=>s?s.slice(5).replace('-','/'):'';
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtB=b=>(b==null||b===''||isNaN(b))?'–':Number(b).toFixed(1);
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
const words=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
function rawToBand(raw,t){if(raw==null||raw===''||isNaN(raw))return null;raw=+raw;for(const[min,b]of t)if(raw>=min)return b;return 0}
function overallOf(arr){if(arr.some(x=>x==null||x===''||isNaN(x)))return null;const a=arr.reduce((s,x)=>s+Number(x),0)/4;const f=a-Math.floor(a);return Math.floor(a)+(f<0.25-1e-9?0:f<0.75-1e-9?0.5:1)}
function cefr(b){if(b==null)return'–';if(b>=8.5)return'C2';if(b>=7)return'C1';if(b>=5.5)return'B2';if(b>=4)return'B1';return'A2'}
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms||2400)}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
function download(name,text,type){const blob=new Blob([text],{type:type||'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ================= local store =================
   DB = {app, v, seedV, cols:{name:{id:{...fields, u:<ms>, del?:true}}}}
   每条记录带修改时间 u，同步时逐条取较新的一份；删除留一个 del 标记，让其他设备也删掉。 */
function emptyDB(){const o={app:'ielts-sprint',v:1,seedV:0,cols:{}};COLS.forEach(c=>o.cols[c]={});return o}
function loadDB(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.cols){COLS.forEach(c=>o.cols[c]=o.cols[c]||{});return o}}catch(e){}return emptyDB()}
let DB=loadDB();
let saveWarned=false;
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){if(!saveWarned){saveWarned=true;toast('本机存储失败：可能是无痕模式或空间不足',4000)}}}
const col=c=>DB.cols[c]||(DB.cols[c]={});
const list=c=>Object.entries(col(c)).filter(([,r])=>r&&!r.del).map(([id,r])=>({id,...r}));
const getRec=(c,id)=>{const r=col(c)[id];return r&&!r.del?{id,...r}:null};
function put(c,id,data){const d={...data};delete d.id;col(c)[id]={...d,u:Date.now()};saveDB();render();scheduleSync()}
function remove(c,id){col(c)[id]={del:true,u:Date.now()};saveDB();render();scheduleSync()}
function merge(a,b){const out={app:'ielts-sprint',v:1,seedV:Math.max(a.seedV||0,b.seedV||0),cols:{}};
  const names=new Set([...COLS,...Object.keys(a.cols||{}),...Object.keys(b.cols||{})]);
  for(const n of names){const x=(a.cols||{})[n]||{},y=(b.cols||{})[n]||{};const o={};
    for(const id of new Set([...Object.keys(x),...Object.keys(y)])){const rx=x[id],ry=y[id];o[id]=!rx?ry:!ry?rx:((ry.u||0)>(rx.u||0)?ry:rx)}out.cols[n]=o}
  return out}

/* ================= GitHub Gist sync ================= */
function loadSync(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}}
let SYNC=loadSync();
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(SYNC))}catch(e){}}
let syncTimer=null,syncing=false,syncAgain=false,syncState={kind:'none',text:'仅本机'};
function setSync(kind,text){syncState={kind,text};const b=$('#sync');b.classList.toggle('on',kind==='ok');b.classList.toggle('err',kind==='err');b.lastElementChild.textContent=text}
function initSyncLabel(){if(!SYNC.token)setSync('none','仅本机');else if(SYNC.last)setSync('ok','上次同步 '+hhmm(SYNC.last));else setSync('none','未同步')}
function scheduleSync(){if(!SYNC.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),2500)}
async function gh(path,opts={}){const r=await fetch('https://api.github.com'+path,{...opts,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+SYNC.token,'X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error('gh '+r.status);e.status=r.status;throw e}return r.status===204?null:r.json()}
async function findGist(){for(let p=1;p<=5;p++){const arr=await gh('/gists?per_page=100&page='+p);if(!arr.length)return'';const g=arr.find(x=>x.files&&x.files[GIST_FILE]);if(g)return g.id;if(arr.length<100)return''}return''}
async function syncNow(manual){
  if(!SYNC.token){if(manual)openSyncSetup();return}
  if(!navigator.onLine){setSync('none','离线，联网后自动同步');if(manual)toast('现在没网，数据已存在本机');return}
  if(syncing){syncAgain=true;return}
  syncing=true;setSync('none','同步中…');
  try{
    if(!SYNC.gistId){SYNC.gistId=await findGist();saveSync()}
    let remote=null,remoteText='';
    if(SYNC.gistId){const g=await gh('/gists/'+SYNC.gistId);const f=g.files&&g.files[GIST_FILE];
      if(f){remoteText=f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content;try{remote=JSON.parse(remoteText)}catch(e){remote=null}}}
    if(remote&&remote.cols){DB=merge(DB,remote);saveDB();render()}
    const text=JSON.stringify(DB);
    if(!SYNC.gistId){const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'雅思冲刺簿 数据（自动同步，请勿手动修改）',public:false,files:{[GIST_FILE]:{content:text}}})});SYNC.gistId=g.id}
    else if(text!==remoteText){await gh('/gists/'+SYNC.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:text}}})})}
    SYNC.last=Date.now();saveSync();setSync('ok','已同步 '+hhmm(SYNC.last));if(manual)toast('同步完成')
  }catch(e){
    const s=e&&e.status;const msg=s===401?'令牌无效或已过期':s===403?'令牌没有 gist 权限，或请求太频繁':s===404?'找不到同步数据，检查令牌的 gist 权限':'同步失败，稍后会自动重试';
    if(s===404){SYNC.gistId='';saveSync()}
    setSync('err',msg);if(manual)toast(msg,3500)
  }finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync()}}
}
window.addEventListener('online',()=>syncNow(false));
let lastVis=0;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastVis>30000){lastVis=Date.now();syncNow(false)}});

/* ================= render: Log ================= */
function weekBars(){
  const t=today(),dow=(parseYmd(t).getDay()+6)%7,mon=addDays(t,-dow);
  const weeks=[];for(let w=7;w>=0;w--){const s=addDays(mon,-7*w);const sum={};LOGK.forEach(k=>sum[k.k]=0);for(let i=0;i<7;i++){const l=logById(addDays(s,i));if(l&&l.min)LOGK.forEach(k=>sum[k.k]+=(+l.min[k.k]||0))}weeks.push({s,sum,tot:LOGK.reduce((a,k)=>a+sum[k.k],0)})}
  const wk=dailyTarget()*7,W=600,H=200,pl=8,pr=8,pt=22,pb=24,max=Math.max(60,wk,...weeks.map(w=>w.tot)),bw=(W-pl-pr)/8;
  let g='';weeks.forEach((w,i)=>{let y=H-pb;const x=pl+i*bw+bw*.18,ww=bw*.64;LOGK.forEach(k=>{const h=w.sum[k.k]/max*(H-pt-pb);if(h>0){y-=h;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${ww.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--c${k.k})"/>`}});
    g+=`<text x="${(x+ww/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${md(w.s)}</text>`;if(w.tot)g+=`<text x="${(x+ww/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">${(w.tot/60).toFixed(1)}h</text>`});
  const wy=(H-pb-wk/max*(H-pt-pb)).toFixed(1);
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${wy}" y2="${wy}" stroke="var(--pencil)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${pl+2}" y="${(wy-5)}" style="fill:var(--ink)">本阶段每周目标 ${(wk/60).toFixed(1)}h</text>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 8 周每周学习时长"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${g}</svg><div class="legend">${LOGK.map(k=>`<span><i class="dot" style="background:var(--c${k.k})"></i>${k.name}</span>`).join('')}</div>`;
}

/* ================= sheet ================= */
function closeSheet(){const sh=$('#sheet');sh.hidden=true;sh.innerHTML=''}
function openPanel(title,html,after){const sh=$('#sheet');sh.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${html}</div>`;sh.hidden=false;sh.onclick=e=>{if(e.target===sh)closeSheet()};if(after)after(sh)}
function openSheet({title,fields,submit='保存',onSubmit,onDelete,onInput,note}){
  const fh=f=>{const id='f-'+f.id;const v=f.value??'';let ctl;
    if(f.type==='select')ctl=`<select id="${id}">${f.options.map(([ov,on])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(on)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')ctl=`<textarea id="${id}" placeholder="${esc(f.ph||'')}" ${f.rows?`style="min-height:${f.rows*22}px"`:''}>${esc(v)}</textarea>`;
    else ctl=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.type==='number'?'inputmode="decimal"':''} ${f.readonly?'readonly':''} ${f.type==='password'?'autocomplete="off"':''}>`;
    return`<div class="field"><label for="${id}">${esc(f.label)}</label>${ctl}${f.hint?`<div class="hint" id="${id}-hint"></div>`:''}</div>`};
  const groups=fields.map(g=>Array.isArray(g)?`<div class="fgrid">${g.map(fh).join('')}</div>`:fh(g)).join('');
  openPanel(title,`${note?`<p class="muted small" style="margin:-6px 0 10px">${note}</p>`:''}<form class="form" id="sheet-form">${groups}<div class="formacts">${onDelete?'<button type="button" class="btn danger" id="sheet-del">删除</button>':''}<span class="sp"></span><button type="button" class="btn" id="sheet-cancel">取消</button><button type="submit" class="btn primary">${esc(submit)}</button></div></form>`);
  const flat=fields.flat();
  const read=()=>{const o={};flat.forEach(f=>{const el=$('#f-'+f.id);if(!el)return;let v=el.value;if(f.type==='number')v=v===''?null:Number(v);o[f.id]=v});return o};
  const hint=(id,txt)=>{const h=$('#f-'+id+'-hint');if(h)h.textContent=txt};
  const set=(id,val)=>{const el=$('#f-'+id);if(el)el.value=val??''};
  const form=$('#sheet-form');if(onInput){const run=()=>onInput(read(),hint,set);form.addEventListener('input',run);form.addEventListener('change',run);run()}
  $('#sheet-cancel').onclick=closeSheet;
  let armed=false;if(onDelete)$('#sheet-del').onclick=e=>{if(!armed){armed=true;e.target.textContent='再点一次确认删除';return}onDelete();closeSheet()};
  form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('[type=submit]');btn.disabled=true;try{const r=await onSubmit(read());if(r!==false)closeSheet()}finally{btn.disabled=false}};
}

    [...SECS.map(s=>({id:'b'+s.k,label:'起点 '+s.name,type:'number',step:.5,value:c.baseline[s.k]}))]],
    onSubmit:v=>{const old=getRec('meta','config')||{};put('meta','config',{...old,target:{overall:v.tO,L:v.tL,R:v.tR,W:v.tW,S:v.tS},baseline:{...c.baseline,L:v.bL,R:v.bR,W:v.bW,S:v.bS},exams:[{label:'一战',date:v.e1||''},{label:'二战',date:v.e2||''}]});toast('已保存')}});
}
function openSyncSetup(){
  const has=!!SYNC.token;
  openPanel('云同步（GitHub Gist）',`
   <p class="small" style="margin-top:0">数据存在你自己 GitHub 账号下的一个<b>私密 Gist</b> 里，不经过任何第三方。每台设备填同一个令牌，就会自动合并。</p>
   <h4>第一次设置</h4>
   <ol class="steps">
     <li>电脑或手机浏览器登录 GitHub，打开 <code>github.com/settings/tokens/new</code>（Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token）</li>
     <li>Note 填「雅思冲刺簿」，Expiration 选 1 年，权限<b>只勾 gist</b></li>
     <li>生成后复制以 <code>ghp_</code> 开头的令牌，粘贴到下面</li>
     <li>在另一台设备上打开本应用，填同一个令牌</li>
   </ol>
   <form class="form" id="sync-form" style="margin-top:10px">
     <div class="field"><label for="f-token">GitHub 令牌</label><input id="f-token" type="password" autocomplete="off" placeholder="${has?'已保存（重新填写可替换）':'ghp_…'}"></div>
     <div class="formacts">${has?'<button type="button" class="btn danger" id="sync-off">停用同步</button>':''}<span class="sp"></span><button type="button" class="btn" id="sync-cancel">关闭</button>${has?'<button type="button" class="btn" id="sync-now">立即同步</button>':''}<button type="submit" class="btn primary">保存并同步</button></div>
   </form>
   <p class="muted small">状态：${esc(syncState.text)}${SYNC.gistId?` · Gist <code>${esc(SYNC.gistId.slice(0,8))}…</code>`:''}<br>令牌只保存在这台设备上，不会被同步。只勾 gist 权限，别人拿到也动不了你的代码仓库。</p>`,
   ()=>{
     $('#sync-cancel').onclick=closeSheet;
     if(has){$('#sync-now').onclick=()=>{closeSheet();syncNow(true)};let armed=false;$('#sync-off').onclick=e=>{if(!armed){armed=true;e.target.textContent='再点一次确认';return}SYNC={};saveSync();initSyncLabel();closeSheet();toast('已停用同步，数据仍保留在本机')}}
     $('#sync-form').onsubmit=e=>{e.preventDefault();const v=$('#f-token').value.trim();if(!v){if(has){closeSheet();syncNow(true)}else toast('先粘贴令牌');return}SYNC={token:v,gistId:'',last:0};saveSync();closeSheet();syncNow(true)};
   });
}
function remindForm(){
  const c=cfg();
  openSheet({title:'每日提醒',note:'生成一个每天重复的日历事件文件。iPad 打开后可直接添加到日历；安卓如果打不开，用手机自带的「时钟」设每日闹钟更省事。',fields:[[{id:'time',label:'每天几点',type:'time',value:c.remind},{id:'dur',label:'时长（分钟）',type:'number',value:dailyTarget()}]],submit:'下载日历文件',
    onSubmit:v=>{const [hh,mm]=(v.time||'20:00').split(':');const d=addDays(today(),1).replace(/-/g,'');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
      const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ielts-sprint//CN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:ielts-sprint-daily-'+Date.now()+'@local','DTSTAMP:'+stamp,`DTSTART:${d}T${hh}${mm}00`,`DURATION:PT${Math.max(15,+v.dur||60)}M`,'RRULE:FREQ=DAILY','SUMMARY:雅思时间','DESCRIPTION:打开雅思冲刺簿，学完点一下打卡。','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:雅思时间到','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
      const old=getRec('meta','config')||{};put('meta','config',{...old,remind:v.time});download('雅思每日提醒.ics',ics,'text/calendar');toast('已生成日历文件')}});
}
function summaryText(){
  const c=cfg(),t=today(),p=currentPhase(),m=latestMock();let week=0;const per={};LOGK.forEach(k=>per[k.k]=0);
  for(let i=0;i<7;i++){const l=logById(addDays(t,-i));if(l&&l.min)LOGK.forEach(k=>{per[k.k]+=(+l.min[k.k]||0);week+=(+l.min[k.k]||0)})}
  const mocks=list('mocks').filter(x=>x.overall!=null).sort((a,b)=>a.date.localeCompare(b.date)).slice(-5);
  const pend=list('essays').filter(e=>e.band==null||e.band==='').length;
  return[`雅思进度摘要（${t}）`,`目标：总分 ${fmtB(c.target.overall)}（听 ${fmtB(c.target.L)} / 读 ${fmtB(c.target.R)} / 写 ${fmtB(c.target.W)} / 说 ${fmtB(c.target.S)}）`,
    `当前阶段：${p?p.name+'（每日目标 '+p.daily+' 分钟）':'–'}`,`考试：${c.exams.filter(e=>e.date).map(e=>e.label+' '+e.date).join('，')||'未报名'}`,
    `近 7 天学习：${week} 分钟（${LOGK.map(k=>k.name+' '+per[k.k]).join('，')}），连续打卡 ${streak()} 天`,
    `最近模考：${mocks.length?mocks.map(x=>`${x.date} ${x.source||''} 总${fmtB(x.overall)}（听${fmtB(x.L)} 读${fmtB(x.R)} 写${fmtB(x.W)} 说${fmtB(x.S)}）`).join('；'):'暂无'}`,
    `复习卡：${list('cards').length} 张，今天到期 ${dueCards().length} 张；待批改作文 ${pend} 篇`].join('\n')}
function openMenu(){
  openPanel('设置',`<div class="menu">
    <button class="btn" data-act="goals">考试与目标<small>考试日期、目标分、起点分</small></button>
    <button class="btn" data-act="sync-menu">云同步<small>${esc(syncState.text)}</small></button>
    <button class="btn" data-act="remind">每日提醒<small>生成每天重复的日历事件</small></button>
    ${isStandalone()?'':'<button class="btn" data-act="install">装到主屏幕<small>像 App 一样打开，断网可用</small></button>'}
    <button class="btn" data-act="summary">复制进度摘要<small>发给老师或 AI，让对方给建议</small></button>
    <button class="btn" data-act="export">导出备份<small>下载全部数据（JSON）</small></button>
    <label class="btn" for="imp" style="cursor:pointer">导入备份<small>与现有数据合并，不会覆盖较新的记录</small></label><input id="imp" type="file" accept=".json,application/json" hidden>
  </div><p class="muted small" style="margin-top:12px">版本 ${APP_VERSION} · 数据保存在本机${SYNC.token?'，并同步到你的 GitHub Gist':''}</p>`,
  ()=>{$('#imp').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||!o.cols)throw 0;DB=merge(DB,o);saveDB();closeSheet();render();scheduleSync();toast('已导入并合并')}catch(e){toast('这个文件不是本应用的备份')}}});
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab&&!t.dataset.act){setTab(t.dataset.tab);return}
  const a=t.dataset.act,id=t.dataset.id;
  const inSheet=!!t.closest('#sheet');
  const acts={
    quick:()=>quickAdd(t.dataset.k),log:()=>logForm(t.dataset.date||today()),goto:()=>setTab(t.dataset.tab),
    mock:()=>mockForm(id),essay:()=>essayForm(id),'essay-copy':()=>essayCopy(id),card:()=>cardForm(id),mat:()=>matForm(id),
    pass:()=>grade(id,true),fail:()=>grade(id,false),cf:()=>{S.cardFilter=t.dataset.v;render()},mf:()=>{S.matFilter=t.dataset.v;render()},
    'todo-new':()=>todoForm(),'todo-edit':()=>todoForm(id),
    'timer-start':()=>{if(getTimer())return;setTimer({k:t.dataset.k,start:Date.now()});render();toast('开始计时，可以锁屏，回来再点结束')},
    'timer-stop':timerStop,'timer-cancel':()=>{if(t.dataset.armed){setTimer(null);render();toast('已放弃这次计时')}else{t.dataset.armed='1';t.textContent='再点一次放弃'}},
    install:()=>{closeSheet();installHelp()},'install-hide':()=>{try{localStorage.setItem(HKEY,'1')}catch(e){}render()},
    menu:openMenu,goals:goalsForm,'sync-menu':openSyncSetup,remind:remindForm,
    summary:async()=>{closeSheet();toast(await copyText(summaryText())?'摘要已复制':'复制失败')},
    export:()=>{download('雅思冲刺簿备份-'+today()+'.json',JSON.stringify(DB,null,1));toast('已导出')}
  };
  if(a==='todo'){const x=getRec('todos',id);if(x)put('todos',id,{...x,done:t.checked});return}
  if(acts[a]){if(inSheet&&['goals','sync-menu','remind'].includes(a))closeSheet();acts[a]()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ================= boot ================= */
applySeeds();
initSyncLabel();
{const h=(location.hash||'').slice(1);if(['today','log','score','review','mat'].includes(h))setTab(h);else render()}
if(SYNC.token)syncNow(false);
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);
</script>
</body>
